<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emberwood — A Tiny 2D RPG</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(1200px 700px at 50% 30%, #1b2436, #0a0d14 70%);
    font-family: "Courier New", monospace; color: #cfd8ea;
  }
  h1 { margin: 6px 0 0; font-size: 15px; letter-spacing: 6px; color: #e8c86a; text-transform: uppercase; }
  #wrap { position: relative; }
  canvas {
    image-rendering: pixelated;
    border: 3px solid #3a4a68; border-radius: 6px;
    background: #000; box-shadow: 0 0 40px rgba(60,90,160,.35);
    display: block;
  }
  #hint { font-size: 11px; opacity: .75; margin-bottom: 8px; }
  kbd { background:#243049; border:1px solid #44557c; border-radius:3px; padding:0 5px; }
</style>
</head>
<body>
  <h1>⚔ Emberwood ⚔</h1>
  <div id="hint">
    Move <kbd>WASD</kbd>/<kbd>Arrows</kbd> · Talk/Open <kbd>E</kbd> or <kbd>Space</kbd> · Menu <kbd>I</kbd> · Save <kbd>F5</kbd> Load <kbd>F8</kbd>
  </div>
  <div id="wrap"><canvas id="game" width="640" height="480"></canvas></div>
  <script src="js/utils.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
